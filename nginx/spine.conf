# Rate limiting zone for /share/* — blunts token brute-force
limit_req_zone $binary_remote_addr zone=share_limit:10m rate=20r/m;

# HTTP — ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name SPINE_DOMAIN;

    access_log /var/log/nginx/spine.http.access.log main;
    error_log  /var/log/nginx/spine.http.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SPINE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/SPINE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SPINE_DOMAIN/privkey.pem;

    access_log /var/log/nginx/spine.access.log main;
    error_log  /var/log/nginx/spine.error.log;

    client_max_body_size 200m;

    # The device's core is one 7 MB script (about 2.5 MB compressed) and the SQLite module 0.9 MB. A distribution's nginx.conf compresses
    # only HTML unless told more, so say it here. Static asset types only: the API's answers are sealed bytes and small JSON.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/wasm image/svg+xml;

    # --- Security headers -------------------------------------------------
    # nginx inherits add_header from an outer level ONLY if the inner level has
    # none of its own. The /share/ location below sets two headers, so it drops
    # everything set here — which is why this block is repeated verbatim there.
    # Changing one copy means changing both; `curl -I` on a /share/ URL is the
    # check. See SECURITY.md S-5.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(self), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # The build is wholly self-hosted: one external module script, one external
    # stylesheet, no inline <script>, no data: URIs, no third-party origin. So
    # script-src needs no 'unsafe-inline'. Styles do: React writes inline style
    # attributes (the upload progress bar, the bbox overlay), and 'unsafe-inline'
    # on style-src is the form every browser honours — style-src-attr would be
    # tighter but falls back to blocking them where it is unsupported.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self' SPINE_RELAY_URL; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # --- Public pointers --------------------------------------------------
    # Links published in the app, the store listings and the docs go through
    # this domain, so the repository host can change without breaking them
    # (requirements TR-OSS-05). install.sh fills the repository URL from .env and
    # drops these three lines when it is unset. Exact matches, so the regex
    # location that denies dotfiles below does not catch security.txt.
    location = /source   { return 302 SPINE_REPO_URL; }
    location = /docs     { return 302 SPINE_REPO_URL/tree/main/docs; }
    location = /security { return 302 SPINE_REPO_URL/blob/main/SECURITY.md; }

    # RFC 9116. install.sh writes it from nginx/security.txt with the domain and an expiry.
    # No add_header here: the global headers apply, and a static text file needs nothing more.
    location = /.well-known/security.txt {
        alias /var/www/spine/security.txt;
        default_type text/plain;
    }

    # Public share links — rate-limited, never cached, never indexed
    location /share/ {
        limit_req zone=share_limit burst=5 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;

        # Repeated from the server level on purpose — see the note there. These
        # are the headers that matter most here: this is the one surface an
        # unauthenticated reader reaches, and it renders text extracted from
        # uploaded documents.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), camera=(self), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self' SPINE_RELAY_URL; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-sent value would otherwise become req.ip (SECURITY.md S-31)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-sent value would otherwise become req.ip (SECURITY.md S-31)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_request_buffering off;
        proxy_redirect off;
    }

    location ~ /\. {
        deny all;
    }
}
