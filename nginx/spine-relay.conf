# The relay for model calls, when it runs on this machine (docs/relay.md). A hostname of its own, because the browser calls it at an
# origin with no path. `install.sh -n` writes it with SPINE_RELAY_DOMAIN filled in when that is set in .env.

server {
    listen 80;
    listen [::]:80;
    server_name SPINE_RELAY_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SPINE_RELAY_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/SPINE_RELAY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SPINE_RELAY_DOMAIN/privkey.pem;

    access_log /var/log/nginx/spine-relay.access.log main;
    error_log  /var/log/nginx/spine-relay.error.log;

    # The relay refuses a body over 32 MB itself; this stops it at the door
    client_max_body_size 32m;

    # The relay answers its own CORS (only SPINE_RELAY_ORIGIN) and serves no page, so no content security policy here
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:RELAY_PORT_HERE;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Chat replies stream: pass each chunk on as it comes
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
