# The Spine server on Cloud Run (docs/deploy-cloud-run.md): `gcloud run services replace app.service.yaml --region=europe-west4`.
# Replace PROJECT_ID, INSTANCE (the Cloud SQL instance's name), TAG, and the bucket and domain below. Nothing here is a secret: each secret is a reference
# to Secret Manager, which the service account named below may read.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: spine
  labels:
    cloud.googleapis.com/location: europe-west4
  annotations:
    # Reached through the global load balancer of the doc (its certificate, its apex domain, the CDN for the hashed assets), not at the run.app address.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Never none: a person signing in should not wait for a start. Two keep one instance's replacement from being an outage.
        autoscaling.knative.dev/minScale: "2"
        # What the database can bear: every instance may open SPINE_DATABASE_POOL connections (the doc's arithmetic).
        autoscaling.knative.dev/maxScale: "40"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:europe-west4:INSTANCE
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: spine-app@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: europe-west4-docker.pkg.dev/PROJECT_ID/spine/spine:TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          # The server listens only after it has opened its database (index.ts), so a 200 means the start went through.
          startupProbe:
            httpGet:
              path: /healthz
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
          env:
            - { name: SPINE_HOST, value: "0.0.0.0" }
            - { name: SPINE_DOMAIN, value: spinevault.eu }
            # Nothing on this instance's disk: the accounts in Postgres, the sealed bytes in a bucket
            - { name: SPINE_STORE, value: postgres }
            - { name: SPINE_OBJECTS, value: gcs }
            - { name: SPINE_GCS_BUCKET, value: BUCKET }
            # Four connections an instance: 40 instances are 160, with the relay's (3 each) and the job's about 280, which the Cloud SQL instance of the doc holds (the doc's arithmetic)
            - { name: SPINE_DATABASE_POOL, value: "4" }
            # No proxy of ours in front: the headers are the server's, the client's address is the last-but-one of X-Forwarded-For (the load balancer adds one, Cloud Run another)
            - { name: SPINE_SERVER_HEADERS, value: "on" }
            - { name: SPINE_TRUSTED_HOPS, value: "1" }
            # Every instance counts the limits in the same place; the hourly work is a job, not a timer in each instance
            - { name: SPINE_LIMITS, value: store }
            - { name: SPINE_JOBS, value: external }
            - { name: SPINE_FAIR_USE_FILE, value: /secrets/fair-use/fair-use.json }
            - { name: SPINE_RELAY_URL, value: "https://relay.spinevault.eu" }
            - { name: SPINE_OPERATOR_NAME, value: CHANGE }
            - { name: SPINE_OPERATOR_CONTACT, value: privacy@spinevault.eu }
            # Where vulnerability reports go (/.well-known/security.txt), when that is not the contact above.
            # - { name: SPINE_OPERATOR_SECURITY_CONTACT, value: CHANGE }
            # Where requests about a person's data go (the privacy notice), when that is not the contact above.
            # - { name: SPINE_OPERATOR_PRIVACY_CONTACT, value: CHANGE }
            # The company line at the foot of every page and in the terms: its numbers (separated by ;, each shown as written) and its address.
            # - { name: SPINE_OPERATOR_IDS, value: "Reg. no. CHANGE; Tax no. CHANGE" }
            # - { name: SPINE_OPERATOR_ADDRESS, value: "CHANGE" }
            - { name: SPINE_REPO_URL, value: "https://github.com/OMN-Edge/spine" }
            - { name: SPINE_MAILER, value: brevo }
            - { name: SPINE_MAIL_SENDER, value: "Account Notices <notices@spinevault.eu>" }
            - { name: SPINE_REGISTRATION, value: open }
            - { name: SPINE_VAULT_MAX_MB, value: "25600" }
            # The operator's page, /admin: who may use it, and who may only read the numbers (docs/billing.md). Set the first before the first sign-in there.
            # - { name: SPINE_ADMIN_EMAILS, value: "you@example.com" }
            # - { name: SPINE_MARKETING_EMAILS, value: "marketing@example.com" }
            # Plans (docs/billing.md; the prices are Paddle's, and every amount is read from them). The relay and the hourly job need only SPINE_BILLING=on.
            # - { name: SPINE_BILLING, value: "on" }
            # - { name: PADDLE_ENVIRONMENT, value: production }
            # - { name: SPINE_CHECKOUT_URL, value: "https://pay.spinevault.eu/" }
            # - { name: SPINE_PADDLE_PRICE_YEAR, value: pri_... }
            # - { name: SPINE_PADDLE_PRICE_MONTH, value: pri_... }
            # - { name: SPINE_PADDLE_PRICE_FOUNDING, value: pri_... }
            # - { name: SPINE_PADDLE_PRICE_ESSENTIAL_YEAR, value: pri_... }     # Essential, family and the top-up are sold only where named
            # - { name: SPINE_PADDLE_PRICE_ESSENTIAL_MONTH, value: pri_... }
            # - { name: SPINE_PADDLE_PRICE_FAMILY_YEAR, value: pri_... }
            # - { name: SPINE_PADDLE_PRICE_FAMILY_MONTH, value: pri_... }
            # - { name: SPINE_PADDLE_PRICE_TOPUP_PAGES, value: pri_... }
            # - { name: PADDLE_API_KEY, valueFrom: { secretKeyRef: { name: spine-paddle-api-key, key: latest } } }
            # - { name: PADDLE_WEBHOOK_SECRET, valueFrom: { secretKeyRef: { name: spine-paddle-webhook-secret, key: latest } } }
            # Or Stripe instead of Paddle (docs/billing.md): one provider at a time. Its prices are Stripe's (SPINE_STRIPE_PRICE_MONTH, _FOUNDING, _ESSENTIAL_YEAR, _ESSENTIAL_MONTH, _FAMILY_YEAR, _FAMILY_MONTH and _TOPUP_PAGES are as Paddle's), and there is no checkout address.
            # - { name: SPINE_BILLING_PROVIDER, value: stripe }
            # - { name: SPINE_STRIPE_PRICE_YEAR, value: price_... }
            # - { name: STRIPE_SECRET_KEY, valueFrom: { secretKeyRef: { name: spine-stripe-secret-key, key: latest } } }
            # - { name: STRIPE_WEBHOOK_SECRET, valueFrom: { secretKeyRef: { name: spine-stripe-webhook-secret, key: latest } } }
            - { name: SESSION_SECRET, valueFrom: { secretKeyRef: { name: spine-session-secret, key: latest } } }
            - { name: SPINE_DATABASE_URL, valueFrom: { secretKeyRef: { name: spine-database-url, key: latest } } }
            - { name: SPINE_RELAY_SECRET, valueFrom: { secretKeyRef: { name: spine-relay-secret, key: latest } } }
            - { name: BREVO_API_KEY, valueFrom: { secretKeyRef: { name: spine-brevo-key, key: latest } } }
          volumeMounts:
            - { name: fair-use, mountPath: /secrets/fair-use }
      volumes:
        - name: fair-use
          secret:
            secretName: spine-fair-use
            items:
              - { key: latest, path: fair-use.json }
  traffic:
    - percent: 100
      latestRevision: true
