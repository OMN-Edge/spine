# The same checks as scripts/check.sh and .gitlab-ci.yml (SECURITY.md S-32, S-36).
name: ci
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:   # the release workflow runs the same checks before it builds anything

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The export, import, photo and sample-record tests run poppler for real; without it they would be skipped and still pass.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: ./scripts/check.sh server
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ./scripts/check.sh web
  # The device's code in a real browser: each native piece (text, rendering, OCR, photos, zip, stamps, signatures), then the whole app
  # against a real server (sign-up, vault, sample records, reload, search, upload, shares, export, a save that fails, passkeys).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ./scripts/check.sh browser
        env:
          CHROME: /usr/bin/google-chrome
          CHROME_FLAGS: --no-sandbox
  # The web app builds to the same files twice, and its hashes.txt (the list a site publishes, which scripts/verify-build.mjs compares) is kept with the run.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ./scripts/check.sh repro
      - uses: actions/upload-artifact@v4
        with:
          name: web-hashes-${{ github.sha }}
          path: web/dist/hashes.txt
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep@sha256:3db5c7af55eb1f512eac0abf0ab69a97b52c74b5e9a27314c221aee1a78d7ab2  # pinned by digest, 2026-10-25; the rules are fetched live
    steps:
      - uses: actions/checkout@v4
      - name: semgrep
        # Same rules and exclusions as scripts/check.sh (see the comment there).
        run: >
          semgrep scan --error --metrics=off
          --config p/typescript --config p/nodejs --config p/security-audit
          --exclude-rule javascript.express.security.audit.xss.direct-response-write.direct-response-write
          --exclude __tests__ --exclude __integration__
          core/src server/src web/src
